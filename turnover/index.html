<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d24">
<title>Stock Turnover พระราม 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: a dark-teal control room. One page, three tabs (ภาพรวม / รายการสินค้า / อัปเดตข้อมูล).
   Summary KPIs first, charts second, the report-style table last. Orange = D/O and emphasis, blue = stock. */
:root {
  color-scheme: dark;
  --bg: #071d24;
  --surface: #0c3843;
  --surface-2: #124a5b;
  --surface-3: #0a2f39;
  --line: rgba(139, 186, 222, .18);
  --line-strong: rgba(139, 186, 222, .34);
  --ink: #eaf3f6;
  --ink-2: #aac4cf;
  --ink-3: #8fadb9;
  --accent: #ff6a05;
  --accent-ink: #1b0a00;
  --accent-text: #ff8a3d;
  --yellow: #fdc440;
  --blue: #8bbade;
  --do: #ff6a05;
  --stk: #8bbade;
  --s1: #e8661c; --s2: #4a93e0; --s3: #c98500; --s4: #1fa87a; --s5: #8a7fe8; --s6: #dc5f8e;
  --hi: #ff6a05;
  --lo: #fdc440;
  --ok: #8bbade;
  --heat: 255, 106, 5;
  --heat2: 253, 196, 64;
  --sb: rgba(139, 186, 222, .42);
  --danger: #ff8a7a;
  --font: 'Chakra Petch', 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef3f5; --surface: #ffffff; --surface-2: #e4edf1; --surface-3: #f6f9fa;
    --line: #d6e1e6; --line-strong: #b4c8d1;
    --ink: #0c3843; --ink-2: #3f6270; --ink-3: #587480;
    --accent: #e8560c; --accent-ink: #ffffff; --accent-text: #b8420a;
    --blue: #2f7fc0; --do: #e8560c; --stk: #0c3843;
    --s1: #e8560c; --s2: #2f7fc0; --s3: #b57600; --s4: #138a72; --s5: #6a55d8; --s6: #c9487f;
    --hi: #e8560c; --lo: #e3a500; --ok: #2f7fc0; --heat: 232, 86, 12; --heat2: 227, 165, 0; --danger: #b3261e; --sb: rgba(47, 127, 192, .5);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef3f5; --surface: #ffffff; --surface-2: #e4edf1; --surface-3: #f6f9fa;
  --line: #d6e1e6; --line-strong: #b4c8d1;
  --ink: #0c3843; --ink-2: #3f6270; --ink-3: #587480;
  --accent: #e8560c; --accent-ink: #ffffff; --accent-text: #b8420a;
  --blue: #2f7fc0; --do: #e8560c; --stk: #0c3843;
  --s1: #e8560c; --s2: #2f7fc0; --s3: #b57600; --s4: #138a72; --s5: #6a55d8; --s6: #c9487f;
  --hi: #e8560c; --lo: #e3a500; --ok: #2f7fc0; --heat: 232, 86, 12; --heat2: 227, 165, 0; --danger: #b3261e; --sb: rgba(47, 127, 192, .5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 56px; -webkit-text-size-adjust: 100%;
}
.app { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.mark { width: 42px; height: 42px; flex: none; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-strong); display: grid; place-items: center; }
.mark svg { display: block; }
h1 { font-size: 26px; letter-spacing: .01em; line-height: 1.15; }
.sub { color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.fresh { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px 11px; font-size: 12px; color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.pill b { color: var(--ink); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--do); display: inline-block; }
.dot.stk { background: var(--stk); }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 16px; color: var(--ink-3); font-weight: 500; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--yellow); }

/* banners */
#banner { display: flex; flex-direction: column; gap: 8px; }
.note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 10px 14px; color: var(--ink-2); }
.note.warn { border-color: var(--yellow); }
.note.err { border-color: var(--danger); }
.note .ic { font-weight: 700; color: var(--yellow); }
.note.err .ic { color: var(--danger); }
.note .grow { flex: 1 1 260px; min-width: 0; }

/* controls */
.controls { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.field { display: flex; align-items: center; gap: 8px; }
.field > label, .lbl { color: var(--ink-3); font-size: 12px; letter-spacing: .04em; }
select, .inp { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px; min-height: 36px; }
select { padding-right: 6px; }
.months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
.mo { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--ink-2); min-width: 0; }
.mo:hover:not(:disabled) { border-color: var(--line-strong); color: var(--ink); }
.mo:disabled { opacity: .38; cursor: default; }
.mo[aria-pressed="true"] { background: var(--surface-2); border-color: var(--yellow); color: var(--ink); box-shadow: inset 0 -3px 0 var(--yellow); }
.mo .pips { display: flex; gap: 4px; }
.pip { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink-3); background: transparent; }
.pip.do.on { background: var(--do); border-color: var(--do); }
.pip.st.on { background: var(--stk); border-color: var(--stk); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 7px 14px; min-height: 36px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); border-color: var(--blue); }
.chip[aria-pressed="false"] { opacity: .6; text-decoration: line-through; text-decoration-color: var(--ink-3); }
.chip.link { border-style: dashed; }
.hint { font-size: 12.5px; color: var(--ink-3); }

/* cards */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 13px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .k { color: var(--ink-3); font-size: 12.5px; }
.kpi .v { font-size: 32px; font-weight: 600; line-height: 1.1; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.kpi .v small { font-size: 13px; font-weight: 400; color: var(--ink-3); }
.kpi.main .v { color: var(--accent-text); }
.kpi .d { font-size: 12.5px; color: var(--ink-2); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.panel h2 { font-size: 16px; }
.panel .ph { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; margin-bottom: 10px; }
.panel .ph .hint { margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid2 > .wide { grid-column: 1 / -1; }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.ax { fill: var(--ink-3); font: 11px var(--font); }
.axl { fill: var(--ink-2); font: 12px var(--font); }
.grid { stroke: var(--line); stroke-width: 1; }
.base { stroke: var(--line-strong); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; z-index: 5; min-width: 150px; max-width: 260px; background: var(--bg); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }
.tip b.t { display: block; margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; }
.legend button { background: none; border: 0; padding: 2px 4px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12.5px; border-radius: 6px; }
.legend button[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.legend .line { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }

/* tables */
.scroll { overflow-x: auto; }
/* scrollbars: เรียวบาง ปลายมน สีน้ำเงินของแบรนด์ → ส้มเมื่อชี้/ลาก ไม่มีปุ่มลูกศร */
.scroll, .scroll.vs { scrollbar-width: thin; scrollbar-color: var(--sb) transparent; }
html { scrollbar-color: var(--sb) var(--bg); }
@supports selector(::-webkit-scrollbar) {
  .scroll, .scroll.vs, html { scrollbar-width: auto; scrollbar-color: auto; }
  .scroll::-webkit-scrollbar { width: 12px; height: 12px; }
  html::-webkit-scrollbar { width: 14px; height: 14px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  html::-webkit-scrollbar-track { background: var(--bg); }
  .scroll::-webkit-scrollbar-thumb, html::-webkit-scrollbar-thumb { background: var(--sb); border: 3px solid transparent; background-clip: content-box; border-radius: 999px; min-height: 36px; min-width: 36px; }
  .scroll::-webkit-scrollbar-thumb:hover, .scroll::-webkit-scrollbar-thumb:active, html::-webkit-scrollbar-thumb:hover, html::-webkit-scrollbar-thumb:active { background: var(--accent); background-clip: content-box; }
  .scroll::-webkit-scrollbar-button, html::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  .scroll::-webkit-scrollbar-corner, html::-webkit-scrollbar-corner { background: transparent; }
}
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { color: var(--ink-3); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
th:first-child, td:first-child { text-align: left; }
td.l, th.l { text-align: left; }
tr.tot td { font-weight: 700; border-top: 2px solid var(--line-strong); background: var(--surface-3); }
tbody tr:hover td { background: var(--surface-3); }
.tag { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11.5px; border: 1px solid var(--line-strong); color: var(--ink-2); }
.tag.hi { border-color: var(--lo); color: var(--ink); }
.inp.nm { width: 100%; min-width: 200px; }
.mvh h2 { font-size: 16px; }
@media (max-width: 1100px) { .grid2.mvgrid { grid-template-columns: minmax(0, 1fr); } }
.mvh .hint { margin: 2px 0 10px; }
.mvempty { padding: 24px 0; text-align: center; }
.mvfoot { margin-top: 8px; }
.scroll.vs { max-height: 420px; overflow-y: auto; border-top: 1px solid var(--line); }
.scroll.vs th { z-index: 1; box-shadow: 0 1px 0 var(--line); white-space: nowrap; line-height: 1.25; vertical-align: bottom; }
.scroll.vs th, .scroll.vs td { padding: 7px 8px; }
.scroll.vs td.nmcol { white-space: normal; overflow-wrap: anywhere; min-width: 130px; }
.nmsub { display: none; overflow-wrap: anywhere; white-space: normal; font-size: 12px; color: var(--ink-3); font-weight: 400; line-height: 1.3; margin-top: 2px; }
@media (max-width: 640px) { .scroll.vs .nmcol, .scroll.vs .hm { display: none; } .scroll.vs .nmsub { display: block; max-width: 200px; } }
td.tu { font-weight: 600; color: var(--accent-text); }
.lnk { background: none; border: 0; padding: 2px 4px; min-height: 0; margin-left: 4px; color: var(--ink-3); font-size: 12px; text-decoration: underline; cursor: pointer; }
.lnk:hover { color: var(--accent-text); }
.tag.lo { border-color: var(--hi); color: var(--accent-text); }
.tag.dead { border-color: var(--danger); color: var(--danger); }
.cell-heat { border-radius: 6px; }
.mxh { background: none; border: 0; color: var(--ink-3); font-size: 12px; padding: 0; }
.mxh:hover, .mxh[aria-pressed="true"] { color: var(--yellow); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); min-width: 64px; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--stk); }

/* update tab */
.drop { position: relative; display: block; border: 2px dashed var(--line-strong); border-radius: 12px; padding: 22px 16px; text-align: center; background: var(--surface-3); color: var(--ink-2); cursor: pointer; }
.drop:hover, .drop.over { border-color: var(--yellow); background: var(--surface-2); color: var(--ink); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop:focus-within { outline: 2px solid var(--yellow); outline-offset: 2px; }
.drop b { display: block; font-size: 15px; color: var(--ink); margin-bottom: 2px; }
.drop.off { opacity: .5; cursor: not-allowed; }
.btn { background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 14px; min-height: 36px; color: var(--ink); }
.btn:hover:not(:disabled) { border-color: var(--yellow); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { border-color: var(--danger); color: var(--danger); background: none; }
.btn:disabled { opacity: .45; cursor: default; }
.msgs { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.msg { font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface-3); color: var(--ink-2); }
.msg.err { border-color: var(--danger); color: var(--danger); }
.msg.ok { border-color: var(--blue); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.days label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-3); }
.days input, .inp { width: 100%; }
.inp { background: var(--surface-3); }
.empty { text-align: center; padding: 48px 16px; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty h2 { font-size: 20px; color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--bg); border: 1px solid var(--yellow); color: var(--ink); border-radius: 10px; padding: 9px 16px; z-index: 20; max-width: min(92vw, 520px); box-shadow: 0 8px 24px rgba(0, 0, 0, .4); }

/* header: theme toggle */
.top-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.icon-btn { width: 38px; height: 38px; flex: none; display: grid; place-items: center; padding: 0; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; display: block; }

/* Day IC trend: headline + small multiples */
.trend-key { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 6px; font-size: 12.5px; color: var(--ink-2); }
.trend-key .k { display: inline-flex; align-items: center; gap: 6px; }
.kd { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.kr { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--yellow); display: inline-block; }
.kl { width: 18px; border-top: 2px dashed var(--hi); display: inline-block; }
.kl.h { border-top-color: var(--lo); margin-left: -10px; }
.sec-t { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; margin: 12px 0 6px; }
.sec-t h3 { font-size: 14px; }
.trend-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.mini { background: var(--surface-3); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 6px; min-width: 0; }
.mini.hi { box-shadow: inset 3px 0 0 var(--lo); }
.mini.lo { box-shadow: inset 3px 0 0 var(--hi); }
.mini .mh { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.mini .mt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mini .mt b { font-size: 14px; overflow-wrap: anywhere; }
.mini .mr { flex: none; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.mini .big { font-size: 24px; font-weight: 700; line-height: 1.1; }
.mini .big.lo { color: var(--accent-text); }
.mini .sm { font-size: 12px; color: var(--ink-3); }
.mini .ax { font-size: 10px; }
.ax.sel { fill: var(--ink); font-weight: 600; }
.vl { fill: var(--ink); font: 600 11.5px var(--font); paint-order: stroke; stroke-width: 3px; stroke-linejoin: round; }
@media (max-width: 900px) { .trend-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .trend-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
  h1 { font-size: 22px; }
  .months { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .kpi .v { font-size: 27px; }
  th, td { padding: 7px 8px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
</style>

<body>


<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 26 26"><rect x="2" y="14" width="5" height="9" rx="1" fill="#8bbade"/><rect x="10.5" y="8" width="5" height="15" rx="1" fill="#fdc440"/><rect x="19" y="3" width="5" height="20" rx="1" fill="#ff6a05"/></svg>
      </div>
      <div>
        <h1>Stock Turnover</h1>
        <div class="sub">สาขาพระราม 3 · D/O และสต๊อกคงเหลือรายเดือน</div>
      </div>
    </div>
    <div class="top-r"><div class="fresh" id="fresh"></div><button class="icon-btn" id="themeBtn" type="button" aria-label="สลับโหมดมืด/สว่าง" title="สลับโหมดมืด/สว่าง"></button></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="เมนู">
    <button class="tab" role="tab" data-tab="overview" aria-selected="true">ภาพรวม</button>
    <button class="tab" role="tab" data-tab="items" aria-selected="false">รายการสินค้า</button>
    <button class="tab" role="tab" data-tab="update" aria-selected="false">อัปเดตข้อมูล</button>
  </nav>

  <div id="banner" aria-live="polite"></div>

  <main>
    <section id="view-overview" class="stack">

    h += seedNote();
    if (S.tab === 'overview' && S.ym && ready()) {
      if (!S.doDocs[S.ym]) h += '<div class="note warn"><span class="ic">!</span><span class="grow">' + C.ymLabel(S.ym) + ' ยังไม่มีข้อมูล D/O จึงคำนวณ Day IC ไม่ได้</span><button class="btn" data-tab-go="update">อัปเดตข้อมูล</button></div>';
      if (!S.stockDocs[S.ym]) h += '<div class="note warn"><span class="ic">!</span><span class="grow">' + C.ymLabel(S.ym) + ' ยังไม่มีข้อมูลสต๊อกคงเหลือ</span><button class="btn" data-tab-go="update">อัปเดตข้อมูล</button></div>';
      var p = partialInfo(S.ym);
      if (p) h += '<div class="note warn"><span class="ic">!</span><span class="grow">D/O เดือนนี้มีถึงวันที่ ' + esc(dd(p.last)) + ' (ยังไม่ครบเดือน) แต่ระบบใช้ ' + p.full + ' วันทำงานเต็มเดือน Day IC จึงสูงกว่าความเป็นจริง แนะนำใช้ประมาณ ' + p.suggest + ' วันทำงาน</span>' +
        (S.canWrite !== false ? '<button class="btn primary" data-act="setdays" data-sym="' + S.ym + '" data-d="' + p.suggest + '">ใช้ ' + p.suggest + ' วัน</button>' : '') + '</div>';
      var nwin = S.basis === 'r3' ? 3 : S.basis === 'r6' ? 6 : 0;
      if (nwin && S.doDocs[S.ym]) {
        var win = C.windowYms(S.ym, S.basis, S.doDocs);
        if (win.length < nwin) {
          var full = null, dy = Object.keys(S.doDocs).sort();
          for (var qi = 0; qi < dy.length && !full; qi++) if (C.windowYms(dy[qi], S.basis, S.doDocs).length === nwin) full = dy[qi];
          h += '<div class="note"><span class="ic">i</span><span class="grow">เลือก “' + BASIS[S.basis] + '” แต่ ' + C.ymLabel(S.ym) + ' มีข้อมูล D/O ย้อนหลังแค่ ' + win.length + ' เดือน (' + rangeLabel(win) + ') จึงคิดจากเท่าที่มี' + (win.length === 1 ? ' ค่าจึงเท่ากับการคิดเฉพาะเดือนนี้' : '') + (full ? ' · ครบ ' + nwin + ' เดือนตั้งแต่ ' + C.ymLabel(full) + ' เป็นต้นไป' : '') + '</span></div>';
        }
      }
    }
    $('#banner').innerHTML = h;
  }

  /* ----- overview ----- */

    h += '<div class="field"><label for="basisSel">Qty/Day คิดจาก</label><select id="basisSel">' + Object.keys(BASIS).map(function (k) { return '<option value="' + k + '"' + (k === S.basis ? ' selected' : '') + '>' + BASIS[k] + '</option>'; }).join('') + '</select></div>';
    h += '<div class="field"><span class="lbl">กลุ่มสินค้า</span><span class="seg" role="group" aria-label="ขอบเขตกลุ่มสินค้า"><button data-scope="main" aria-pressed="' + (S.scope === 'main') + '">6 กลุ่มหลัก</button><button data-scope="all" aria-pressed="' + (S.scope === 'all') + '">ทุกกลุ่ม</button></span></div>';

      h += '<button class="mo" data-ym="' + ym + '" aria-pressed="' + (ym === S.ym) + '"' + ((hd || hs) ? '' : ' disabled') + ' title="' + C.TH_MONTH_FULL[m - 1] + ' · D/O ' + (hd ? 'มี' : 'ไม่มี') + ' · สต๊อก ' + (hs ? 'มี' : 'ไม่มี') + '"><span>' + C.TH_MONTHS[m - 1] + '</span><span class="pips"><i class="pip do' + (hd ? ' on' : '') + '"></i><i class="pip st' + (hs ? ' on' : '') + '"></i></span></button>';

    }).join('') + '<button class="chip link" data-gall="1">เลือกทั้งหมด</button></div>';
    h += '<div class="hint"><i class="pip do on" style="display:inline-block;vertical-align:-1px"></i> มีข้อมูล D/O &nbsp; <i class="pip st on" style="display:inline-block;vertical-align:-1px"></i> มีข้อมูลสต๊อก &nbsp;·&nbsp; Qty/Day = D/O รวมในช่วงที่เลือก ÷ วันทำงานของช่วงนั้น &nbsp;·&nbsp; Day IC = สต๊อกสิ้นเดือน ÷ Qty/Day' + (S.basis === 'month' ? '' : ' &nbsp;·&nbsp; การ์ด Day IC และตารางสรุปแสดง <b>ค่าเฉลี่ยของแต่ละเดือน</b> ในช่วงที่เลือก') + '</div>';
    $('#controls').innerHTML = h;
  }

  function dlt(cur, prev, kind, unit) {
    if (cur == null || prev == null || !isFinite(cur) || !isFinite(prev)) return '<span class="muted">ยังไม่มีเดือนก่อนให้เทียบ</span>';
    var diff = cur - prev, up = diff > 0.00001, dn = diff < -0.00001;
    var arrow = up ? '▲' : dn ? '▼' : '■';
    var txt = kind === 'pct' ? (prev ? (diff >= 0 ? '+' : '') + nf(diff / prev * 100, 1) + '%' : '–') : (diff >= 0 ? '+' : '') + nf(diff, 2) + (unit ? ' ' + unit : '');
    return arrow + ' ' + txt + ' <span class="muted">จากเดือนก่อน</span>';
  }
  function kpi(label, val, unit, d, cls) {
    return '<div class="kpi' + (cls ? ' ' + cls : '') + '"><div class="k">' + label + '</div><div class="v num">' + val + (unit ? '<small>' + unit + '</small>' : '') + '</div><div class="d num">' + d + '</div></div>';
  }
  function statusTag(v) {
    if (v == null) return '<span class="tag">ไม่มี D/O</span>';
    if (v > S.cfg.warnHigh) return '<span class="tag hi">▲ สูง</span>';
    if (v < S.cfg.warnLow) return '<span class="tag lo">▼ ต่ำ</span>';
    return '<span class="tag">ปกติ</span>';
  }

  function renderOverview() {
    renderControls();
    var body = $('#ov-body');
    if (!ready()) { body.innerHTML = '<div class="panel"><div class="empty muted">กำลังโหลดข้อมูล…</div></div>'; return; }
    if (!allYms().length || !S.ym) {
      body.innerHTML = '<div class="panel"><div class="empty"><h2>ยังไม่มีข้อมูล</h2><div>อัปโหลดไฟล์ D/O และไฟล์สต๊อกคงเหลือรายเดือน แล้วแดชบอร์ดจะคำนวณ Stock Turnover ให้ทันที</div>' + (S.canWrite === false ? '<div class="muted">บัญชีนี้ดูข้อมูลได้อย่างเดียว ให้เจ้าของแดชบอร์ดเป็นผู้อัปโหลด</div>' : '<button class="btn primary" data-tab-go="update">ไปหน้าอัปเดตข้อมูล</button>') + '</div></div>';
      return;
    }
    var groups = selGroups(), cur = metrics(S.ym, groups), prevYm = C.addMonths(S.ym, -1);
    var prev = (S.doDocs[prevYm] || S.stockDocs[prevYm]) ? metrics(prevYm, groups) : null;
    var T = cur.total, P = prev ? prev.total : null;
    var A = S.basis === 'month' ? null : C.avgDayIC(core(), S.ym, S.basis, groups);
    var h = '<div class="kpis">';
    if (A) h += kpi('Day IC รวม · เฉลี่ย', A.total.avg != null ? nf(A.total.avg, 2) : '–', 'วัน', A.total.n ? '<span class="muted">เฉลี่ยของ ' + A.total.n + ' เดือน (' + rangeLabel(A.yms) + ')<br>' + C.monthShort(S.ym) + ' = ' + (T.dayIC != null ? nf(T.dayIC, 2) : '–') + ' วัน</span>' : '<span class="muted">ยังไม่มี Day IC ในช่วงนี้</span>', 'main');
    else h += kpi('Day IC รวม', T.dayIC != null ? nf(T.dayIC, 2) : '–', 'วัน', dlt(T.dayIC, P && P.dayIC, 'abs', 'วัน'), 'main');
    var isM = S.basis === 'month', nW = cur.windowYms.length, rng = rangeLabel(cur.windowYms);
    h += kpi('สต๊อกคงเหลือ ' + C.monthShort(S.ym), nf(tn(T.stockKg), 1), 'ตัน', dlt(T.stockKg, P && P.stockKg, 'pct'));
    if (isM) h += kpi('D/O ' + C.monthShort(S.ym), nf(tn(T.doKg), 1), 'ตัน', dlt(T.doKg, P && P.doKg, 'pct'));
    else h += kpi('D/O ' + rng, T.winDoKg != null ? nf(tn(T.winDoKg), 1) : '–', 'ตัน', nW ? '<span class="muted">รวม ' + nW + ' เดือน · เฉลี่ย ' + nf(tn(T.winDoKg) / nW, 1) + ' ตัน/เดือน</span>' : '<span class="muted">ไม่มี D/O ในช่วงนี้</span>');
    h += kpi('Qty/Day', nf(tn(T.qtyDay), 1), 'ตัน/วัน', '<span class="muted">' + BASIS[S.basis] + (S.basis === 'month' ? '' : ' · ใช้ข้อมูล ' + cur.windowYms.length + ' เดือน (' + rangeLabel(cur.windowYms) + ')') + ' · ' + cur.days + ' วันทำงาน</span>');
    if (isM) h += kpi('D/O ÷ สต๊อก', T.turns != null ? nf(T.turns, 2) : '–', 'เท่า', dlt(T.turns, P && P.turns, 'abs'));
    else h += kpi('D/O ÷ สต๊อก', T.winTurns != null ? nf(T.winTurns, 2) : '–', 'เท่า', '<span class="muted">D/O ' + rng + ' ÷ สต๊อก ' + C.monthShort(S.ym) + '</span>');
    h += '</div>';
    h += '<div class="grid2">';
    h += '<div class="panel wide"><div class="ph"><h2>Day IC รายเดือน</h2><span class="hint">Day IC = สต๊อกที่มีพอขายได้กี่วัน · ต่ำหรือสูงเกินเกณฑ์ = เฝ้าระวัง · คลิกที่กราฟเพื่อเลือกเดือน</span></div><div class="trend-key" id="lg-trend"></div><div class="sec-t"><h3 id="tt-total"></h3></div><div class="chart" id="ch-trend"></div><div class="sec-t"><h3>แยกรายกลุ่ม</h3><span class="hint" id="tt-mini"></span></div><div class="trend-grid" id="ch-minis"></div></div>';
    h += '<div class="panel"><div class="ph"><h2>D/O และสต๊อก รายเดือน (ตัน)</h2></div><div class="chart" id="ch-bars"></div><div class="legend"><span class="chip" style="border:0;padding:2px 4px"><i class="sw" style="background:var(--do)"></i>D/O</span><span class="chip" style="border:0;padding:2px 4px"><i class="sw" style="background:var(--stk)"></i>สต๊อกสิ้นเดือน</span></div></div>';
    h += '<div class="panel"><div class="ph"><h2>' + (A ? 'Day IC เฉลี่ยรายกลุ่ม · ' + rangeLabel(A.yms) + ' ' + (+S.ym.slice(0, 4) + 543) : 'Day IC รายกลุ่ม · ' + C.ymLabel(S.ym)) + '</h2><span class="hint">เรียงจากต่ำสุด · ส้ม ▼ = ต่ำกว่าเกณฑ์ · เหลือง ▲ = สูงกว่าเกณฑ์</span></div><div class="chart" id="ch-groups"></div></div>';
    h += '</div>';
    h += '<div class="panel"><div class="ph"><h2>ตาราง Stock Turnover · ' + C.ymLabel(S.ym) + '</h2><span class="hint">' + BASIS[S.basis] + (S.basis === 'month' ? '' : ' (' + rangeLabel(cur.windowYms) + ')') + (A ? ' · Day IC เฉลี่ยของ ' + A.total.n + ' เดือน' : ' · เทียบกับ ' + C.ymLabel(prevYm)) + '</span></div><div class="scroll" id="tbl-main"></div></div>';
    h += '<div class="panel"><div class="ph"><h2>Day IC รายกลุ่ม × เดือน</h2><span class="hint">คลิกชื่อเดือนเพื่อดูเดือนนั้น · ส้ม ▼ = ต่ำกว่าเกณฑ์ · เหลือง ▲ = สูงกว่าเกณฑ์</span></div><div class="scroll" id="tbl-matrix"></div></div>';
    h += '<div class="row"><button class="btn" data-act="export">ส่งออกตารางเป็น Excel</button><span class="hint">ไฟล์รูปแบบเดียวกับรายงาน Turn Over เดิม (หน่วย กก.)</span></div>';
    body.innerHTML = h;
    renderTable(cur, prev, groups, A);
    renderMatrix(groups);
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(function () { drawCharts(groups, cur, A); });
  }

  function renderTable(cur, prev, groups, A) {
    var isM = S.basis === 'month', dok = isM ? 'doKg' : 'winDoKg', tot = cur.total, h = '<table><thead><tr><th>กลุ่มสินค้า</th><th>D/O' + (isM ? '' : ' ' + rangeLabel(cur.windowYms)) + ' (ตัน)</th><th>สต๊อก (ตัน)</th><th>สัดส่วนสต๊อก</th><th>Qty/Day (ตัน)</th><th>' + (A ? 'Day IC เฉลี่ย (วัน)' : 'Day IC (วัน)') + '</th><th>' + (A ? 'Day IC ' + C.monthShort(S.ym) : 'เทียบเดือนก่อน') + '</th><th class="l">สถานะ</th></tr></thead><tbody>';
    var rows = cur.rows.map(function (r, i) { return { r: r, p: prev ? prev.rows[i] : null }; });
    rows.forEach(function (x, ri) {
      var r = x.r, mainIC = A ? A.rows[ri].avg : r.dayIC, share = (tot.stockKg && r.stockKg != null) ? r.stockKg / tot.stockKg * 100 : null;
      var dv = (x.p && r.dayIC != null && x.p.dayIC != null) ? r.dayIC - x.p.dayIC : null;
      h += '<tr><td><b>' + esc(gname(r.g)) + '</b> <span class="muted">' + r.g + '</span></td><td class="num">' + nf(tn(r[dok]), 1) + '</td><td class="num">' + nf(tn(r.stockKg), 1) + '</td><td class="num"><div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><span>' + nf(share, 1) + '%</span><span class="bar"><i style="width:' + Math.min(100, share || 0) + '%"></i></span></div></td><td class="num">' + nf(tn(r.qtyDay), 2) + '</td><td class="num"><b>' + nf(mainIC, 2) + '</b></td><td class="num">' + (A ? nf(r.dayIC, 2) : dv == null ? '–' : (dv > 0 ? '▲ +' : dv < 0 ? '▼ ' : '■ ') + nf(dv, 2)) + '</td><td class="l">' + statusTag(mainIC) + '</td></tr>';
    });
    var dvT = (prev && tot.dayIC != null && prev.total.dayIC != null) ? tot.dayIC - prev.total.dayIC : null;
    h += '<tr class="tot"><td>รวม ' + groups.length + ' กลุ่ม</td><td class="num">' + nf(tn(tot[dok]), 1) + '</td><td class="num">' + nf(tn(tot.stockKg), 1) + '</td><td class="num">100%</td><td class="num">' + nf(tn(tot.qtyDay), 2) + '</td><td class="num">' + nf(A ? A.total.avg : tot.dayIC, 2) + '</td><td class="num">' + (A ? nf(tot.dayIC, 2) : dvT == null ? '–' : (dvT > 0 ? '▲ +' : dvT < 0 ? '▼ ' : '■ ') + nf(dvT, 2)) + '</td><td class="l">' + statusTag(A ? A.total.avg : tot.dayIC) + '</td></tr></tbody></table>';
    $('#tbl-main').innerHTML = h;
  }

  function renderMatrix(groups) {
    var Y = S.ym.slice(0, 4), yms = [], m;
    for (m = 1; m <= 12; m++) { var ym = C.ymOf(+Y, m); if (S.doDocs[ym] && S.stockDocs[ym]) yms.push(ym); }
    if (!yms.length) { $('#tbl-matrix').innerHTML = '<div class="muted">ยังไม่มีเดือนที่มีทั้ง D/O และสต๊อก</div>'; return; }
    var mm = yms.map(function (ym) { return metrics(ym, groups); });
    function cell(v) {
      if (v == null) return '<td class="num muted">–</td>';
      var st = stateOf(v), bgc = st === 'lo' ? 'rgba(var(--heat),.30)' : st === 'hi' ? 'rgba(var(--heat2),.34)' : '';
      return '<td class="num"><span class="cell-heat" style="display:inline-block;min-width:54px;padding:2px 8px;' + (st ? 'font-weight:700;background:' + bgc : '') + '">' + (st === 'lo' ? '▼ ' : st === 'hi' ? '▲ ' : '') + nf(v, 2) + '</span></td>';
    }
    var h = '<table><thead><tr><th>กลุ่มสินค้า</th>' + yms.map(function (ym) { return '<th><button class="mxh" data-ym="' + ym + '" aria-pressed="' + (ym === S.ym) + '">' + C.monthShort(ym) + '</button></th>'; }).join('') + '<th>เฉลี่ย</th></tr></thead><tbody>';
    groups.forEach(function (g, i) {
      var vals = mm.map(function (x) { return x.rows[i].dayIC; }), ok = vals.filter(function (v) { return v != null; });
      h += '<tr><td><b>' + esc(gname(g)) + '</b></td>' + vals.map(cell).join('') + '<td class="num">' + (ok.length ? nf(ok.reduce(function (a, b) { return a + b; }, 0) / ok.length, 2) : '–') + '</td></tr>';
    });
    var tv = mm.map(function (x) { return x.total.dayIC; }), tok = tv.filter(function (v) { return v != null; });
    h += '<tr class="tot"><td>รวม</td>' + tv.map(cell).join('') + '<td class="num">' + (tok.length ? nf(tok.reduce(function (a, b) { return a + b; }, 0) / tok.length, 2) : '–') + '</td></tr></tbody></table>';
    $('#tbl-matrix').innerHTML = h;
  }

  /* ---------- charts ---------- */
  function stepFor(max) {
    var raw = max / 4 || 1, p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }
  function axis(max) { var st = stepFor(max), mx = Math.ceil(max / st - 1e-9) * st, t = []; for (var v = 0; v <= mx + 1e-9; v += st) t.push(v); return { max: mx || st, ticks: t, step: st }; }
  function fmtTick(v, step) { return nf(v, step < 1 ? 1 : 0); }
  function tipPos(host, tip, x, y) {
    var w = host.clientWidth, tw = tip.offsetWidth;
    var left = x + 14; if (left + tw > w) left = x - tw - 14; if (left < 0) left = 0;
    tip.style.left = left + 'px'; tip.style.top = Math.max(0, y - 10) + 'px';
  }
  function barTop(x, y, w, h, r) {
    if (h <= 0) return '';
    r = Math.min(r, w / 2, h);
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }

  function drawCharts(groups, cur, A) {
    if (S.tab !== 'overview' || !$('#ch-trend')) return;
    var Y = S.ym.slice(0, 4), yms = [], m;
    for (m = 1; m <= 12; m++) { var ym = C.ymOf(+Y, m); if (S.doDocs[ym] || S.stockDocs[ym]) yms.push(ym); }
    var mm = yms.map(function (ym) { return metrics(ym, groups); });
    /* trend: total headline + one small chart per group */

  function cmpDo(en) {

  /* ---------- file handling ---------- */
  function readFile(file) {
    return file.arrayBuffer().then(function (buf) {
      var u8 = new Uint8Array(buf);
      if (u8.length > 2 && u8[0] === 0xFF && u8[1] === 0xFE) {
        var text = new TextDecoder('utf-16le').decode(buf);
        return [{ name: file.name, rows: text.split(/\r?\n/).map(function (l) { return l.split('\t'); }) }];
      }
      if (typeof XLSX === 'undefined') throw new Error('xlsx-missing');
      var wb = XLSX.read(u8, { type: 'array', dense: true, cellDates: false, cellStyles: false, cellNF: false });
      return wb.SheetNames.map(function (n) { return { name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: true }) }; });
    });
  }
  function errText(e, kind) {
    var c = e && e.error;
    if (e && e.message === 'xlsx-missing') return 'โหลดตัวอ่านไฟล์ Excel ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วเปิดหน้านี้ใหม่';
    if (c === 'so') return 'ไฟล์นี้เป็นรายงาน Sales Order Outstanding (ยอดค้างส่ง) ไม่ใช่ข้อมูล ' + (kind === 'do' ? 'D/O' : 'สต๊อก');
    if (c === 'stock') return 'ไฟล์นี้เป็นข้อมูลสต๊อก ให้ลากไปวางที่ช่อง “2 · สต๊อกคงเหลือรายเดือน”';
    if (c === 'do') return 'ไฟล์นี้เป็นรายงาน D/O ให้ลากไปวางที่ช่อง “1 · ข้อมูล D/O”';
    if (c === 'cols') return 'หาคอลัมน์ที่จำเป็นไม่พบ: ' + e.missing.join(', ');
    if (c === 'empty') return 'ไม่พบแถวข้อมูลที่มีวันที่ Actual GI date';
    if (c === 'notdo') return 'ไม่ใช่รายงานการส่งสินค้า (ไม่พบหัวคอลัมน์ Actual GI date)';
    if (c === 'notstock') return 'ไม่พบตารางสต๊อก (ต้องมีคอลัมน์ Material, Matl Group, Stock และ น้ำหนักรวม)';
    return 'อ่านไฟล์ไม่สำเร็จ: ' + ((e && e.message) || 'ไม่ทราบสาเหตุ');
  }
  function tick() { return new Promise(function (r) { setTimeout(r, 30); }); }

  async function handleDo(files) {
    S.msgs.do = []; S.busy.do = true; renderUpdate(); await tick();
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      try {
        var sheets = await readFile(f), res = null, lastErr = null;
        for (var k = 0; k < sheets.length; k++) { var r = C.parseDo(sheets[k].rows); if (r.error) { lastErr = r; continue; } res = r; break; }
        if (!res) { S.msgs.do.push({ k: 'err', t: f.name + ': ' + errText(lastErr || {}, 'do') }); continue; }
        var months = Object.keys(res.months);
        months.forEach(function (ym) {
          var m = res.months[ym], ex = S.staged.do[ym];
          if (ex && (ex.month.last > m.last || (ex.month.last === m.last && ex.month.kg >= m.kg))) return;
          var en = { ym: ym, month: m, src: f.name, include: true }; en.include = cmpDo(en).inc; S.staged.do[ym] = en;
        });
        Object.keys(res.groupDesc || {}).forEach(function (g) { if (!S.groupDesc[g]) { S.groupDesc[g] = res.groupDesc[g]; S.newDesc = true; } });
        S.msgs.do.push({ k: 'ok', t: f.name + ': พบ ' + nf(res.items) + ' รายการ ใน ' + months.length + ' เดือน' + (res.excluded.lines ? ' · ไม่นับเศษเหล็ก/ค่าบริการ ' + res.excluded.lines + ' รายการ' : '') });
      } catch (e) { S.msgs.do.push({ k: 'err', t: f.name + ': ' + errText(e, 'do') }); }

    }
    S.busy.do = false; renderUpdate();
  }
  async function handleStock(files) {
    S.msgs.stock = []; S.busy.stock = true; renderUpdate(); await tick();

      var f = files[i];

        var sheets = await readFile(f), p = C.parseStockWorkbook(sheets);
        if (p.error) { S.msgs.stock.push({ k: 'err', t: f.name + ': ' + errText(p, 'stock') }); continue; }
        var det = C.detectStockDate([p.sheet, f.name]);

        S.msgs.stock.push({ k: det ? 'ok' : 'err', t: f.name + ': พบ ' + nf(p.lines) + ' แถว (ชีท ' + p.sheet + ')' + (det ? '' : ' · ไม่พบเดือนในชื่อชีท/ไฟล์ กรุณาเลือกเดือนเอง') });

      renderUpdate(); await tick();
    }
    S.busy.stock = false; renderUpdate();
  }

  function fitDoc(o) {
    if (JSON.stringify(o).length < 235000) return o;
    var c = JSON.parse(JSON.stringify(o)); c.mats = (c.mats || []).slice(0, 900).map(function (m) { m[4] = ''; return m; });
    return c;
  }
  async function saveStaged() {
    if (!S.db) return;

      var ks = Object.keys(S.staged.do).sort();
      for (var i = 0; i < ks.length; i++) {
        var en = S.staged.do[ks[i]]; if (!en.include) continue;
        var m = en.month, doc = fitDoc({ ym: en.ym, rows: m.rows, mats: m.mats, first: m.first, last: m.last, lines: m.lines, kg: m.kg, src: en.src, at: now });

      }
      for (var j = 0; j < S.staged.stock.length; j++) {
        var s = S.staged.stock[j]; if (!s.include || !s.ym) continue;
        var sd = fitDoc({ ym: s.ym, rows: s.p.rows, mats: s.p.mats, kg: s.p.kg, lines: s.p.lines, asOf: s.asOf || null, src: s.src, at: now });
        await S.db.doc('stock/' + s.ym).set(sd); ok++;

      if (S.newDesc) { await saveCfg(); S.newDesc = false; }
      S.staged = { do: {}, stock: [] }; S.msgs = { do: [], stock: [], save: [{ k: 'ok', t: 'บันทึกแล้ว ' + ok + ' รายการ แดชบอร์ดอัปเดตให้ทุกคนที่เปิดอยู่แล้ว' }] };

  /* ---------- export ---------- */

      try {

  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button, [data-tab], [data-ym]'); if (!t) return;
    if (t.id === 'themeBtn') { toggleTheme(); return; }

      if (cur.has(g)) { if (cur.size > 1) cur.delete(g); } else cur.add(g);

    } else if (act === 'save') saveStaged();

  /* แก้ชื่อสินค้า: Esc = ยกเลิก, คลิกที่อื่นโดยไม่เปลี่ยนค่า = ปิดช่องพิมพ์ */
